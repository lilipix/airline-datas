spark.master                                   local[*]
spark.driver.memory                            2g
spark.driver.extraJavaOptions                  -XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0
spark.hadoop.fs.defaultFS                      hdfs://namenode:9000
spark.hadoop.dfs.replication                   2
spark.hadoop.dfs.blocksize                     16777216
spark.hadoop.dfs.client.use.datanode.hostname  true
spark.jars.packages                            io.delta:delta-spark_4.2_2.13:4.4.1
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.warehouse.dir                        hdfs://namenode:9000/lakehouse/warehouse
